<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulpal - Dental Clinical Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <div class="logo-text">
                    <span class="main-title">Interactive Pulpal & Periapical Diagnosis Tutor</span>
                </div>
            </div>
        </header>

        <div class="exam-dashboard glass-panel">
            <div class="exam-progress">
                <div class="progress-text">
                    <span id="progress-text-label">Question 1 of ...</span>
                    <span id="progress-percentage">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-bar-fill"></div>
                </div>
            </div>
            <div class="exam-stats">
                <div class="stat-badge correct-badge">Correct: <span id="stat-correct">0</span></div>
                <div class="stat-badge incorrect-badge">Incorrect: <span id="stat-incorrect">0</span></div>
                <div class="stat-badge timer-badge">Time: <span id="exam-timer">00:00</span></div>
            </div>
        </div>

        <main class="quiz-container">

            <div class="quiz-card glass-panel" id="quiz-card">
                <div class="content-section">
                    <div class="progress-indicator" style="margin-bottom: 0.5rem; color: var(--accent-blue); font-weight: 600; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px;">
                        <span id="question-counter">Question 1</span>
                    </div>
                    <h2 class="question-text" id="question-text">Loading question...</h2>
                    
                    <div class="options-container" id="options-container">
                        <!-- Options will be injected here by JS -->
                    </div>

                    <div class="feedback-panel hidden" id="feedback-panel">
                        <div class="feedback-header">
                            <div class="feedback-icon" id="feedback-icon"></div>
                            <h3 class="feedback-title" id="feedback-title">Feedback</h3>
                        </div>
                        <p class="feedback-text" id="feedback-text">Explanation goes here.</p>
                    </div>
                    
                    <button class="btn-primary action-btn hidden" id="next-btn" style="margin-top: 1.5rem;">Next Question</button>
                </div>

                <div class="image-section">
                    <div class="image-wrapper">
                        <img id="question-image" src="" alt="Clinical Case Image">
                        <div class="image-loader" id="image-loader"></div>
                    </div>
                </div>
            </div>
            
            <div class="completion-screen hidden" id="completion-screen">
                <div class="completion-card glass-panel">
                    <h2>Quiz Completed!</h2>
                    <p>You have finished all available cases.</p>
                    <div class="score-display">
                        <span class="score-value" id="final-score">0</span>
                        <span class="score-total" id="total-questions">/ 0</span>
                    </div>
                    <button class="btn-primary action-btn" id="restart-btn">Restart Quiz</button>
                </div>
            </div>
        </main>
    </div>

    <script src="main.js?v=5"></script>
</body>
</html>
